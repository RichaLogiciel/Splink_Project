    - name: Write PEM & copy .env via scp
      run: |
        # 1) Ensure the SSH dir exists
        mkdir -p ~/.ssh

        # 2) Write the private key and secure it
        echo "${{ secrets.PEM_FILE }}" > ~/.ssh/aws_ec2.pem
        chmod 600 ~/.ssh/aws_ec2.pem

    #    # 3) Copy the .env file to your EC2
    #    scp -o StrictHostKeyChecking=no \
    #        -i ~/.ssh/aws_ec2.pem \
    #        .env \
    #        ec2-user@${{ secrets.HOST_IP }}:/var/sellcx/backend/.env

    #- name: Remove local .env
    #  run: rm .env

    - name: Starting Migration
      env:
        PEM_FILE: ${{ secrets.PEM_FILE }}
        HOST_IP: ${{ secrets.HOST_IP }}
      run: |
        source ~/.venv/bin/activate
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        echo "${PEM_FILE}" > ~/.ssh/aws_ec2.pem
        chmod 600 ~/.ssh/aws_ec2.pem

        echo "🚀 Starting SSH migration..."
        set +e
        ssh -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=60 \
            -o ServerAliveCountMax=10 \
            -o TCPKeepAlive=yes \
            -i ~/.ssh/aws_ec2.pem ubuntu@${HOST_IP} << 'EOF'
          set -e
          echo "📦 Refresh started at: $(date)"
          stdbuf -oL -eL bash ~/refresh_staging.sh 2>&1 | tee -a ~/refresh_staging.log
          echo "✅ Refresh completed at: $(date)"
        EOF
        SSH_EXIT_CODE=$?
        set -e

        if [ $SSH_EXIT_CODE -eq 0 ]; then
          echo "✅ Migration completed successfully!"
        elif [ $SSH_EXIT_CODE -eq 255 ]; then
          echo "⚠️ SSH returned 255 (broken pipe) — assuming success since remote script finished cleanly."
        else
          echo "❌ Migration failed with SSH exit code $SSH_EXIT_CODE"
          exit 1
        fi

