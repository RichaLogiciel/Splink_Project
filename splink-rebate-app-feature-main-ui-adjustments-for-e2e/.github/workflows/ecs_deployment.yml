name: Deploy to Prod Amazon ECS

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Prod ECS
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Fetch Secrets from AWS Secrets Manager
        id: fetch-secrets
        run: |
          # Retrieve secrets from AWS Secrets Manager
          SECRET_NAME=${{ vars.SECRET_NAME }}
          REGION=${{ vars.AWS_REGION }}
          SECRETS=$(aws secretsmanager get-secret-value --secret-id $SECRET_NAME --region $REGION | jq -r '.SecretString' | jq -r "to_entries|map(\"\(.key)=\\\"\(.value|tostring)\\\"\")|.[]")
          echo "$SECRETS" > .env

      - name: Build, Tag, and Push Docker Image
        id: build-image
        run: |
          # Get the ECR registry URL
          ECR_REGISTRY=$(aws ecr describe-repositories --repository-names ${{ vars.ECR_REPOSITORY }} --query 'repositories[0].repositoryUri' --output text)

          IMAGE_TAG=${{ vars.IMAGE_TAG }}
          BRANCH_NAME=${{ github.ref_name }}
          echo "Building image with tag: $ECR_REGISTRY:$IMAGE_TAG for branch: $BRANCH_NAME"

          # Determine the environment based on the branch
          if [ "$BRANCH_NAME" = "develop" ]; then
            ENV=develop
          else
            ENV=main
          fi

          # Build and push Docker image
          docker build -t $ECR_REGISTRY:${IMAGE_TAG} .
          docker push $ECR_REGISTRY:${IMAGE_TAG}

          echo "image=$ECR_REGISTRY:${IMAGE_TAG}" >> $GITHUB_ENV

      - name: Generate ECS Task Definition
        id: generate-td
        run: |
          sed "s|<TASK_FAMILY>|${{ vars.TASK_FAMILY }}|g; \
          s|<CONTAINER_NAME>|${{ vars.CONTAINER_NAME }}|g; \
          s|<IMAGE_URI>|${{ env.image }}|g; \
          s|<EXECUTION_ROLE_ARN>|${{ secrets.EXECUTION_ROLE_ARN }}|g; \
          s|<ECS_TASK_ROLE_ARN>|${{ secrets.ECS_TASK_ROLE_ARN }}|g; \
          s|<NEXT_PUBLIC_API_BASE_URL_ARN>|${{ secrets.NEXT_PUBLIC_API_BASE_URL_ARN }}|g" \
          .github/workflows/td-template.json > td.json

      - name: Register Task Definition
        id: register-task-def
        run: |
          set -euo pipefail
          TASK_DEF_ARN=$(aws ecs register-task-definition --cli-input-json file://td.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Registered task definition: $TASK_DEF_ARN"
          echo "TASK_DEF_ARN=$TASK_DEF_ARN" >> $GITHUB_ENV

      - name: Deploy (rolling deployment)
        id: update-service
        run: |
          set -euo pipefail
          echo "Updating ECS service ${{ vars.ECS_SERVICE }} on cluster ${{ vars.ECS_CLUSTER }} to use task definition ${TASK_DEF_ARN}"
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "${{ vars.ECS_SERVICE }}" \
            --task-definition "${TASK_DEF_ARN}" \
            --deployment-configuration "maximumPercent=200,minimumHealthyPercent=50" \
            --force-new-deployment

      - name: Wait for service to become stable
        id: wait-stable
        run: |
          set -euo pipefail
          echo "Waiting for ECS service ${{ vars.ECS_SERVICE }} in cluster ${{ vars.ECS_CLUSTER }} to become stable..."
          aws ecs wait services-stable --cluster "${{ vars.ECS_CLUSTER }}" --services "${{ vars.ECS_SERVICE }}"
          echo "Service ${{ vars.ECS_SERVICE }} is now stable."

      - name: Describe service (for logs / verification)
        if: always()
        run: |
          aws ecs describe-services --cluster "${{ vars.ECS_CLUSTER }}" --services "${{ vars.ECS_SERVICE }}" --output json
